<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Ayman Calc interface preview</title>
  <desc id="desc">Dark responsive calculator with purple accents, Ayman Calc branding, display, and calculator buttons.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#32145f"/>
      <stop offset="38%" stop-color="#111018"/>
      <stop offset="100%" stop-color="#030304"/>
    </radialGradient>
    <linearGradient id="eq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity=".55"/>
    </filter>
    <filter id="purpleGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#8b5cf6" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="900" height="900" fill="url(#bgGlow)"/>

  <g transform="translate(255 55)" filter="url(#shadow)">
    <rect x="0" y="0" width="390" height="790" rx="30" fill="#111116" fill-opacity=".96" stroke="#ffffff" stroke-opacity=".08"/>

    <!-- Brand -->
    <g transform="translate(24 24)">
      <rect x="0" y="0" width="52" height="52" rx="14" fill="#09090c" stroke="#8b5cf6" stroke-opacity=".65" filter="url(#purpleGlow)"/>
      <text x="26" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">AB</text>
      <text x="68" y="22" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Ayman Calc</text>
      <text x="68" y="41" font-family="Arial, sans-serif" font-size="11" fill="#8e8e9d">JavaScript Calculator</text>
    </g>

    <!-- Display -->
    <line x1="24" x2="366" y1="220" y2="220" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="350" y="190" text-anchor="end" font-family="Arial, sans-serif" font-size="48" font-weight="500" fill="#ffffff">0</text>

    <!-- Buttons -->
    <g font-family="Arial, sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle">
      <!-- Row 1 -->
      <circle cx="67" cy="282" r="34" fill="#8b5cf6" fill-opacity=".075"/><text x="67" y="282" fill="#d1c4ff">AC</text>
      <circle cx="153" cy="282" r="34" fill="#8b5cf6" fill-opacity=".075"/><text x="153" y="282" fill="#d1c4ff">DEL</text>
      <circle cx="239" cy="282" r="34" fill="#8b5cf6" fill-opacity=".075"/><text x="239" y="282" fill="#d1c4ff">%</text>
      <circle cx="325" cy="282" r="34" fill="#8b5cf6" fill-opacity=".095"/><text x="325" y="282" font-size="26" fill="#b89cff">÷</text>

      <!-- Row 2 -->
      <circle cx="67" cy="368" r="34" fill="#ffffff" fill-opacity=".055"/><text x="67" y="368" fill="#ffffff">7</text>
      <circle cx="153" cy="368" r="34" fill="#ffffff" fill-opacity=".055"/><text x="153" y="368" fill="#ffffff">8</text>
      <circle cx="239" cy="368" r="34" fill="#ffffff" fill-opacity=".055"/><text x="239" y="368" fill="#ffffff">9</text>
      <circle cx="325" cy="368" r="34" fill="#8b5cf6" fill-opacity=".095"/><text x="325" y="368" font-size="26" fill="#b89cff">×</text>

      <!-- Row 3 -->
      <circle cx="67" cy="454" r="34" fill="#ffffff" fill-opacity=".055"/><text x="67" y="454" fill="#ffffff">4</text>
      <circle cx="153" cy="454" r="34" fill="#ffffff" fill-opacity=".055"/><text x="153" y="454" fill="#ffffff">5</text>
      <circle cx="239" cy="454" r="34" fill="#ffffff" fill-opacity=".055"/><text x="239" y="454" fill="#ffffff">6</text>
      <circle cx="325" cy="454" r="34" fill="#8b5cf6" fill-opacity=".095"/><text x="325" y="454" font-size="26" fill="#b89cff">−</text>

      <!-- Row 4 -->
      <circle cx="67" cy="540" r="34" fill="#ffffff" fill-opacity=".055"/><text x="67" y="540" fill="#ffffff">1</text>
      <circle cx="153" cy="540" r="34" fill="#ffffff" fill-opacity=".055"/><text x="153" y="540" fill="#ffffff">2</text>
      <circle cx="239" cy="540" r="34" fill="#ffffff" fill-opacity=".055"/><text x="239" y="540" fill="#ffffff">3</text>
      <circle cx="325" cy="540" r="34" fill="#8b5cf6" fill-opacity=".095"/><text x="325" y="540" font-size="27" fill="#b89cff">+</text>

      <!-- Row 5 -->
      <circle cx="67" cy="626" r="34" fill="#ffffff" fill-opacity=".055"/><text x="67" y="626" fill="#ffffff">00</text>
      <circle cx="153" cy="626" r="34" fill="#ffffff" fill-opacity=".055"/><text x="153" y="626" fill="#ffffff">0</text>
      <circle cx="239" cy="626" r="34" fill="#ffffff" fill-opacity=".055"/><text x="239" y="626" fill="#ffffff">.</text>
      <circle cx="325" cy="626" r="34" fill="url(#eq)" filter="url(#purpleGlow)"/><text x="325" y="626" font-size="27" font-weight="700" fill="#ffffff">=</text>
    </g>

    <text x="195" y="732" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8e8e9d">
      Built by <tspan fill="#c4b5fd">Ayman Bounaouj</tspan> • 2026
    </text>
  </g>
</svg>